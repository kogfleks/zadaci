===============================================================================
 BATERIJA ZADATAKA KOGNITIVNE FLEKSIBILNOSTI - jsPsych (online)
===============================================================================
 Tri zadatka jedan za drugim, istim redoslijedom za sve ispitanike
 (logika individualnih razlika: Miyake i sar., 2000):
   1. WCST - zadatak sortiranja karata (Heaton i sar., 1993)
   2. NLT  - zadatak broj-slovo (Miyake i sar., 2000)
   3. PRL  - probabilisticko reverzno ucenje (Wieland i sar., 2023)
 Kod svakog zadatka (procedura, uputa, raspored, bodovanje, format podataka)
 preuzet je doslovno iz finalnih pojedinacnih online verzija (WCST_online,
 NLT_online, PRL_online); izvori i odluke istrazivaca opisani su u njihovim
 zaglavljima, UPUTSTVIMA i opisima procedure. Spajanje radi build_battery.py.

 ZAJEDNICKO: provjera uredjaja, sifra ispitanika i prikaz preko cijelog
 ekrana samo jednom na pocetku; opsta instrukcija (ekran 1 isti kao u
 PsychoPy verziji, ekran 2 sa savjetima samo online); najava prije svakog zadatka ("PRVI ZADATAK (od tri)" ...);
 izmedju zadataka pauza koju
 kontrolise ispitanik (nastavlja tipkom SPACE kad je spreman).
 SNIMANJE: odmah nakon svakog zadatka (trials + summary, isti fajlovi kao
 u pojedinacnim verzijama), preko DataPipe-a u isti folder na Google Driveu. Ako
 ispitanik odustane, ranije zavrseni zadaci su vec snimljeni.
 Zbirna tabela (jedan red po ispitaniku): battery_scores.py.

 PODESAVANJE: DATAPIPE_ID (12 znakova sa pipe.jspsych.org). Prazno = podaci
 se nakon svakog zadatka preuzimaju na racunar (za testiranje).
 Sifra ispitanika moze se poslati u linku: ?id=P01 (ili PROLIFIC_PID).
===============================================================================
-->

const choiceTrial = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: () => {
    const c = DECK[st.cardIdx];
    return '<div class="screen">' + keysHTML(true) + cardHTML(c.image, 0, STIM_Y) + '</div>';
  },
  choices: 'NO_KEYS',
  on_load: () => {
    const t0 = performance.now();
    let done = false;
    document.querySelectorAll('.key').forEach(el => el.addEventListener('mousedown', ev => {
      if (done || ev.button !== 0) return;
      done = true;
      const response = Number(el.dataset.key);
      const rt = performance.now() - t0;
      recordChoice(response, rt);
      jsPsych.finishTrial({ response, rt });

  }

function recordChoice(response, rt) {
  const c = DECK[st.cardIdx];
  const principle = PRINCIPLES[st.catIdx];
  const k = KEY_CARDS[response - 1];
  const correct = c[principle] === k[principle];
  rows.push({ participant: PARTICIPANT, session: '001', phase: 'test', trial: st.cardIdx + 1,
              deck: c.deck, deck_position: c.position, form: c.form, number: c.number, color: c.color,
              image: c.image, principle, response, response_card: KEY_IMAGES[response - 1],
              rt_ms: Math.round(rt * 10) / 10 });
  st.last = { response, correct, image: c.image };
  st.runCorrect = correct ? st.runCorrect + 1 : 0;
  if (st.runCorrect === CATEGORY_CRITERION) {        // zavrsena kategorija -> novo pravilo, bez upozorenja
    st.categories += 1;
    st.runCorrect = 0;
    if (st.categories < MAX_CATEGORIES) st.catIdx += 1;
  }
  st.cardIdx += 1;
}

function roundHalfEven(x, d) {          // kao Pythonov round(x, d): tacna polovina -> na parno
  const m = 10 ** d;
  if (Number.isInteger(x * 2 * m) && !Number.isInteger(x * m)) {
    const f = Math.floor(x * m);
    return (f % 2 === 0 ? f : f + 1) / m;
  }
  return Number(x.toFixed(d));
}
function score(trials) {

  T.forEach((t, i) => {
    const k = KEY_CARDS[t.response - 1];
    const m = DIMS.filter(d => t[d] === k[d]);
    t._m = m;
    t.matched = m.length ? [...m].sort().join('+') : 'other';
    t.match_color = m.includes('color'); t.match_form = m.includes('form');
    t.match_number = m.includes('number'); t.match_other = m.length === 0;
    t.ambiguous = m.length >= 2;
    t.correct = m.includes(t.principle);

    t.after_category = afterCompletion; afterCompletion = false;
    if (t.correct) runCorrect += 1;
    else { if (runCorrect >= 5) fms += 1; runCorrect = 0; }
    t.consecutive_correct = runCorrect;
    t.category_completed = false;
    if (runCorrect === CATEGORY_CRITERION) {

      if (firstCatTrial === null) firstCatTrial = i + 1;
      runCorrect = 0; categoryNo += 1; afterCompletion = true;

    for (let a = 0; a < unamb.length; a++) if (unamb[a] > i) { next = unamb[a]; break; }
    return [prev, next];

    const m = t._m;

  'category_completed', 'persev_principle', 'perseverative', 'persev_error', 'nonpersev_error', 'conceptual',

  if (v === null || v === undefined) v = 'NA';

}

const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function download(name, text) {
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });

  document.body.appendChild(a); a.click(); a.remove();
}
async function saveAll() {

  const out = [['Variable', 'Value', 'Type'], ['participant', PARTICIPANT, ''], ['session', '001', ''],

  const base = `${PARTICIPANT.replace(/[^\w\-]/g, '_')}_WCST_${stamp(START)}`;
  const files = [[base + '_trials.csv', trials], [base + '_summary.csv', toCSV(out)]];
  ALL_FILES.push(...files.map(f => [TASK_LABEL, ...f]));
  if (!DATAPIPE_ID) { files.forEach(([nm, t]) => download(nm, t)); return; }

}

const RT_MIN_ANALYSIS = 200, RT_LOWER = 300, RT_UPPER = 3500, SD_CRITERION = 3, EXTRA_CRITERION = 0.5;

      mean_rt_pure: r_(pure), mean_rt_block1: r_(mean(rts(isB1))), mean_rt_block2: r_(mean(rts(isB2))),
      mean_rt_switch: r_(sw), mean_rt_repeat: r_(rep),

  }

  const miy = rtMeasures(an, t => t.rt_trimmed);

    accuracy_block2: r_(acc(test, isB2), 3), accuracy_block3: r_(acc(test, isB3), 3), accuracy_switch: r_(acc(test, isSw), 3),

};
['accuracy_overall', 'accuracy_pure', 'accuracy_block1', 'accuracy_block2', 'accuracy_block3', 'accuracy_switch',

[1, 2, 3].forEach(b => ['practice_errors_b', 'extra_given_b', 'extra_accuracy_b'].forEach(k => {
  MEASURE_TYPE[k + b] = 'probni pokusaji (isto za obje obrade RT)'; }));
const FLOAT_KEYS = new Set(['shift_cost', 'local_switch_cost', 'mixing_cost', 'mean_rt_pure', 'mean_rt_block1',
  'mean_rt_block2', 'mean_rt_switch', 'mean_rt_repeat', 'accuracy_overall', 'accuracy_pure', 'accuracy_block1',
  'accuracy_block2', 'accuracy_block3', 'accuracy_switch', 'accuracy_repeat', 'extra_accuracy_b1', 'extra_accuracy_b2',
  'extra_accuracy_b3', 'rt_ms', 'rt_trimmed']);

}

const TRIAL_FIELDS = ['participant', 'session', 'phase', 'block', 'trial', 'quadrant', 'task', 'stimulus',
  'number', 'letter', 'order', 'category', 'correct_key', 'congruent', 'trial_type',
  'response', 'correct', 'rt_ms', 'rt_used_raw', 'rt_used_miyake', 'rt_trimmed', 'trim_flag'];
function fmt(k, v) {                     // brojevi zapisani kao u Pythonu (npr. 723.0)
  if (v === null || v === undefined) return 'NA';

}

const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();

  const [scored, summary] = score(rows);
  const trialRows = scored.map(r => TRIAL_FIELDS.map(k => fmt(k, k === 'rt_trimmed' && r[k] !== null ? pyRound(r[k], 1) : r[k])));
  const trials = toCSV([TRIAL_FIELDS].concat(trialRows));
  const out = [['Variable', 'Raw', 'Miyake', 'Type'], ['participant', PARTICIPANT, PARTICIPANT, ''], ['session', '001', '001', ''],

}

function trialTimeline(sched, filesFn, phaseLabel) {
  const t = { sched, left: null, right: null, files: null, key: null, rt: null,
              choiceSide: null, choiceCard: null, correct: null, outcome: null,
              points: 0, onset: null, iti: null };

  // 5.1 Izbor (najduze 1500 ms); karte bez krizica
  const choice = {
    type: jsPsychHtmlKeyboardResponse,
    on_start: trial => {
      [t.left, t.right] = shuffle2();
      t.files = filesFn();
      trial.stimulus = cardsHTML(t);            // krizic nestaje kad se pojave karte [2, 3]
    },
    stimulus: '',
    choices: Object.keys(KEYS),
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: true,
    on_load: () => { t.onset = (performance.now() - sessionStart) / 1000; },
    on_finish: d => {
      if (d.response === null) return;
      t.key = String(d.response).toLowerCase();
      t.rt = d.rt;
      t.choiceSide = KEYS[t.key];
      t.choiceCard = t.choiceSide === 'left' ? t.left : t.right;
      if (state.card1 === null) state.card1 = t.choiceCard;     // karta 1 = prvi izbor [5]
      const card2 = state.card1 === 'A' ? 'B' : 'A';
      t.betterCard = sched.better === 1 ? state.card1 : card2;
      t.correct = t.choiceCard === t.betterCard ? 1 : 0;
      // antikorelirani ishodi: varljiv pokusaj (better_rewarded = 0) obrce ishod
      t.outcome = ((t.correct === 1) === (sched.better_rewarded === 1)) ? 'win' : 'loss';
      t.points = t.outcome === 'win' ? POINTS_WIN : POINTS_LOSS;
    }
  };

  // 5.2a Crveni okvir do isteka 1500 ms (ISI = 1500 - RT)
  const frame = {
    timeline: [{
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => cardsHTML(t, { frame: t.choiceSide }),
      choices: 'NO_KEYS',
      trial_duration: () => Math.max(0, RESPONSE_WINDOW - t.rt)
    }],
    conditional_function: () => t.key !== null && RESPONSE_WINDOW - t.rt > 1
  };
  // 5.3 Povratna informacija 500 ms
  const feedback = {
    timeline: [{
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => cardsHTML(t, { frame: t.choiceSide, feedback: t.outcome }),
      choices: 'NO_KEYS',
      trial_duration: FEEDBACK_DUR
    }],
    conditional_function: () => t.key !== null
  };
  // 5.2b Bez odgovora: "Presporo!"
  const tooSlow = {
    timeline: [{ type: jsPsychHtmlKeyboardResponse, stimulus: slowHTML, choices: 'NO_KEYS', trial_duration: TOO_SLOW_DUR }],
    conditional_function: () => t.key === null
  };
  // 5.4 Fiksacija 1-2 s + biljezenje reda
  const iti = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: fixHTML,
    choices: 'NO_KEYS',
    trial_duration: 0,
    on_start: trial => {
      t.iti = ITI_MIN + Math.random() * (ITI_MAX - ITI_MIN);
      trial.trial_duration = t.iti;
      record(t, phaseLabel);
    }
  };
  return { timeline: [choice, frame, feedback, tooSlow, iti] };
}

function record(t, phaseLabel) {
  const s = t.sched;
  if (phaseLabel !== 'practice') state.pointsTotal += t.points;
  const c1 = state.card1;
  const better = c1 === null ? null : (s.better === 1 ? c1 : (c1 === 'A' ? 'B' : 'A'));
  rows.push({
    participant: PARTICIPANT, session: '001', phase: phaseLabel,
    trial: s.trial, segment: s.segment, reversal: s.reversal, better: s.better, card1: c1,
    better_card: better, better_card_image: better ? t.files[better] : null, better_rewarded: s.better_rewarded,
    left_card: t.left, right_card: t.right, left_image: t.files[t.left], right_image: t.files[t.right],
    resp_key: t.key, choice_side: t.choiceSide, choice_card: t.choiceCard,
    choice_image: t.choiceCard ? t.files[t.choiceCard] : null,
    rt_ms: t.rt === null ? null : Math.round(t.rt * 10) / 10,
    missed: t.key === null ? 1 : 0, correct: t.correct, outcome: t.outcome,
    points: t.points, points_total: state.pointsTotal,
    onset_s: Math.round(t.onset * 10000) / 10000, iti_s: Math.round(t.iti) / 1000
  });
}

function blockTimeline(schedule, filesFn, practice) {
  const tl = [{
    type: jsPsychHtmlKeyboardResponse, stimulus: fixHTML, choices: 'NO_KEYS', trial_duration: 1000,
    on_start: () => { state.card1 = null; }      // karta 1 posebno za vjezbu i zadatak
  }];
  schedule.forEach(s => tl.push(trialTimeline(s, filesFn, practice ? 'practice' : s.phase)));
  return { timeline: tl };
}

const N_REVERSALS = 5, PRE_REV_WINDOW = 5, LEARNING_RUN = 8;
function pyRound(x, d) {                 // kao Pythonov round(x, d): tacna binarna vrijednost, polovina -> na parno
  const neg = x < 0 || Object.is(x, -0);
  const str = Math.abs(x).toFixed(100);
  const [ip, fp] = str.split('.');
  let keep = BigInt(ip + fp.slice(0, d));
  const rest = fp.slice(d), half = '5' + '0'.repeat(rest.length - 1);
  if (rest > half || (rest === half && keep % 2n === 1n)) keep += 1n;
  const k = keep.toString().padStart(d + 1, '0');
  return Number((neg ? '-' : '') + (d > 0 ? k.slice(0, -d) + '.' + k.slice(-d) : k));
}
const sum_ = x => { let s = 0.0; for (const v of x) s += v; return s; };
const mean_ = x => x.length ? sum_(x) / x.length : null;
const r_ = (x, d = 3) => x === null ? 'NA' : pyRound(x, d);

function annotate(trials) {
  const T = trials.map(t => ({ ...t }));
  ['practice', 'main'].forEach(part => {
    let prev = null;
    T.forEach(t => {
      if ((t.phase === 'practice') !== (part === 'practice')) return;
      t.stay = t.win_stay = t.lose_switch = null;
      t.misleading_loss = null;
      t.error_run = t.pers_error = t.chance_error = null;
      if (t.missed) return;
      t.misleading_loss = (t.correct === 1 && t.outcome === 'loss') ? 1 : 0;
      if (prev !== null) {
        t.stay = t.choice_card === prev.choice_card ? 1 : 0;
        if (prev.outcome === 'win') t.win_stay = t.stay; else t.lose_switch = 1 - t.stay;
      }
      prev = t;
    });
  });
  const main = T.filter(t => t.phase !== 'practice');
  for (let seg = 2; seg <= N_REVERSALS + 1; seg++) {
    const resp = main.filter(t => t.segment === seg && !t.missed);
    let i = 0;
    while (i < resp.length) {
      if (resp[i].correct === 0) {
        let j = i;
        while (j < resp.length && resp[j].correct === 0) j++;
        const run = j - i;
        for (let k = i; k < j; k++) {
          resp[k].error_run = run; resp[k].pers_error = run >= 2 ? 1 : 0; resp[k].chance_error = run === 1 ? 1 : 0;
        }
        i = j;
      } else { resp[i].pers_error = 0; resp[i].chance_error = 0; i++; }
    }
  }
  return T;
}

function score(trials) {
  const T = annotate(trials);
  const main = T.filter(t => t.phase !== 'practice');
  const resp = main.filter(t => !t.missed);
  const S = {};
  const persByRev = [];
  for (let seg = 2; seg <= N_REVERSALS + 1; seg++) {
    persByRev.push(main.some(t => t.segment === seg)
      ? resp.filter(t => t.segment === seg).reduce((a, t) => a + t.pers_error, 0) : null);
  }
  const done = persByRev.filter(p => p !== null);
  const all = done.length === N_REVERSALS;
  const pSum = done.reduce((a, b) => a + b, 0);
  S.perseverative_errors = all ? pSum : 'NA';
  S.perseverative_errors_per_reversal = all ? r_(pSum / N_REVERSALS) : 'NA';
  S.chance_errors = all ? resp.filter(t => t.chance_error !== null).reduce((a, t) => a + t.chance_error, 0) : 'NA';
  let nMis = 0, nSw = 0;
  resp.forEach((t, i) => {
    if (t.misleading_loss === 1 && i + 1 < resp.length && resp[i + 1].segment === t.segment) {
      nMis++; nSw += resp[i + 1].correct === 0 ? 1 : 0;
    }
  });
  S.prob_switch_rate = nMis ? r_(nSw / nMis) : 'NA';
  S.n_misleading_losses = nMis;
  let nTwo = 0, nRep = 0;                 // ponavljanje izbora nakon dva uzastopna gubitka [Reiter i sar., 2016]
  for (let i = 2; i < resp.length; i++) {
    const a = resp[i - 2], b = resp[i - 1], c = resp[i];
    if (a.outcome === 'loss' && b.outcome === 'loss' && a.choice_card === b.choice_card) {
      nTwo++; nRep += c.choice_card === b.choice_card ? 1 : 0;
    }
  }
  const nLoss = resp.filter(t => t.outcome === 'loss').length;
  S.stay_after_two_losses = nLoss ? r_(nRep / nLoss) : 'NA';
  S.p_stay_after_two_losses = nTwo ? r_(nRep / nTwo) : 'NA';
  S.n_two_losses = nTwo;
  const groups = { total: main };
  PHASES.forEach(p => { groups[p] = main.filter(t => t.phase === p); });
  Object.entries(groups).forEach(([g, ts]) => {
    const rs = ts.filter(t => !t.missed);
    const ws = rs.filter(t => t.win_stay !== null).map(t => t.win_stay);
    const ls = rs.filter(t => t.lose_switch !== null).map(t => t.lose_switch);
    S['prop_correct_' + g] = r_(mean_(rs.map(t => t.correct)));
    S['n_errors_' + g] = rs.filter(t => t.correct === 0).length;
    S['win_stay_' + g] = r_(mean_(ws));
    S['lose_switch_' + g] = r_(mean_(ls));
    S['mean_rt_ms_' + g] = r_(mean_(rs.map(t => t.rt_ms)), 1);
    S['n_missed_' + g] = ts.length - rs.length;
  });
  S.points_total = resp.reduce((a, t) => a + (t.outcome === 'win' ? 1 : -1), 0);
  S.n_trials = main.length;
  const s1 = resp.filter(t => t.phase === 'stable1');
  let run = 0, best = 0;
  s1.forEach(t => { run = t.correct === 1 ? run + 1 : 0; best = Math.max(best, run); });
  S.learning_criterion = s1.length ? (best >= LEARNING_RUN ? 1 : 0) : 'NA';
  const pre = [];
  for (let r = 1; r <= N_REVERSALS; r++) {
    const before = resp.filter(t => t.segment === r).slice(-PRE_REV_WINDOW);
    const hasNext = main.some(t => t.segment === r + 1);
    const v = (before.length && hasNext) ? mean_(before.map(t => t.correct)) : null;
    pre.push(v); S['pre_rev_acc_r' + r] = r_(v);
  }
  S.pre_rev_acc_mean = r_(mean_(pre.filter(v => v !== null)));
  persByRev.forEach((p, i) => { S['pers_errors_r' + (i + 1)] = p === null ? 'NA' : p; });
  const pr = T.filter(t => t.phase === 'practice'), prr = pr.filter(t => !t.missed);
  S.prop_correct_practice = r_(mean_(prr.map(t => t.correct)));
  S.n_missed_practice = pr.length - prr.length;
  return [T, S];
}

const MEASURE_TYPE = {
  perseverative_errors: 'PRIMARNA mjera fleksibilnosti (den Ouden i sar., 2013)',
  perseverative_errors_per_reversal: 'PRIMARNA mjera fleksibilnosti (prosjek po reverziji)',
  chance_errors: 'dodatna mjera (den Ouden i sar., 2013)',
  prob_switch_rate: 'mjera fleksibilnosti: osjetljivost na varljivi gubitak (Brolsma i sar., 2020)',
  n_misleading_losses: 'opisna mjera',
  prop_correct_reversal: 'mjera fleksibilnosti: prilagodjavanje promjenama (Wieland i sar., 2023)',
  stay_after_two_losses: 'mjera fleksibilnosti: ponavljanje nakon dva gubitka (Reiter i sar., 2016)',
  p_stay_after_two_losses: 'dodatna mjera (uslovna vjerovatnoca ostajanja nakon dva gubitka)',
  n_two_losses: 'opisna mjera',
  learning_criterion: 'kontrolna mjera (Brolsma i sar., 2020)',
  pre_rev_acc_mean: 'kontrolna mjera (tacnost prije reverzija)'
};
['total', 'stable1', 'stable2'].forEach(g => { MEASURE_TYPE['prop_correct_' + g] = 'mjera ucenja (Wieland i sar., 2023)'; });
['total'].concat(PHASES).forEach(g => {
  MEASURE_TYPE['win_stay_' + g] = 'mjera ucenja (Wieland i sar., 2023)';
  MEASURE_TYPE['lose_switch_' + g] = 'mjera ucenja (Wieland i sar., 2023)';
});
for (let r = 1; r <= N_REVERSALS; r++) {
  MEASURE_TYPE['pers_errors_r' + r] = 'perseverativne greske nakon reverzije ' + r;
  MEASURE_TYPE['pre_rev_acc_r' + r] = 'kontrolna mjera (tacnost prije reverzije ' + r + ')';
}
const ORDER = ['perseverative_errors', 'perseverative_errors_per_reversal', 'chance_errors',
  'prob_switch_rate', 'n_misleading_losses', 'stay_after_two_losses',
  'p_stay_after_two_losses', 'n_two_losses', 'prop_correct_reversal']
  .concat(...['total'].concat(PHASES).map(g => ['prop_correct', 'n_errors', 'win_stay', 'lose_switch',
    'mean_rt_ms', 'n_missed'].map(k => k + '_' + g)))
  .concat(['points_total', 'n_trials', 'learning_criterion', 'pre_rev_acc_mean'])
  .concat(Array.from({ length: N_REVERSALS }, (_, i) => 'pre_rev_acc_r' + (i + 1)))
  .concat(Array.from({ length: N_REVERSALS }, (_, i) => 'pers_errors_r' + (i + 1)))
  .concat(['prop_correct_practice', 'n_missed_practice']);
const isFloatKey = k => /^(prop_correct|win_stay|lose_switch|mean_rt_ms|pre_rev_acc)_/.test(k) ||
  ['prob_switch_rate', 'perseverative_errors_per_reversal', 'stay_after_two_losses', 'p_stay_after_two_losses',
   'rt_ms', 'onset_s', 'iti_s'].includes(k);
function fmt(k, v) {                     // brojevi zapisani kao u Pythonu (npr. 1.0)
  if (v === null || v === undefined) return 'NA';
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (isFloatKey(k) && typeof v === 'number' && Number.isInteger(v)) return v.toFixed(1);
  return v;
}
function summaryRows(S) {
  const seen = new Set(), out = [];
  ORDER.forEach(k => { if (k in S && !seen.has(k)) { out.push([k, fmt(k, S[k]), MEASURE_TYPE[k] || 'opisna mjera']); seen.add(k); } });
  return out;
}

const TRIAL_FIELDS = ['participant', 'session', 'phase', 'trial', 'segment', 'reversal',
  'better', 'card1', 'better_card', 'better_card_image', 'better_rewarded',
  'left_card', 'right_card', 'left_image', 'right_image',
  'resp_key', 'choice_side', 'choice_card', 'choice_image', 'rt_ms', 'missed',
  'correct', 'outcome', 'points', 'points_total',
  'stay', 'win_stay', 'lose_switch', 'misleading_loss',
  'error_run', 'pers_error', 'chance_error', 'onset_s', 'iti_s'];

function csvCell(v) {
  v = String(v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
const toCSV = rs => rs.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';

function download(name, text) {
  const blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function saveAll() {
  const [scored, S] = score(rows);
  const trials = toCSV([TRIAL_FIELDS].concat(scored.map(r => TRIAL_FIELDS.map(k => fmt(k, r[k])))));
  const c1 = (rows.find(r => r.phase !== 'practice' && r.card1) || {}).card1;
  const out = [['Variable', 'Value', 'Type'], ['participant', PARTICIPANT, ''], ['session', '001', ''],
    ['start_time', isoLocal(START), ''],
    ['card1_image', c1 ? MAIN_CARD_FILES[c1] : 'NA', 'karta izabrana u prvom pokusaju (karta 1)']]
    .concat(summaryRows(S));
  out.push(['duration_min', ((performance.now() - sessionStart) / 60000).toFixed(2), 'opisna mjera']);
  out.push(['note', 'Faze (Wieland i sar., 2023): stable1 = 1-55, reversal = 56-125, stable2 = 126-160; 5 reverzija. ' +
    'Definicije mjera: prl_scoring.py (verzija 3). Online verzija (jsPsych).', '']);
  const base = `${PARTICIPANT.replace(/[^\w\-]/g, '_')}_PRL_${stamp(START)}`;
  const files = [[base + '_trials.csv', trials], [base + '_summary.csv', toCSV(out)]];
  ALL_FILES.push(...files.map(f => [TASK_LABEL, ...f]));
  if (!DATAPIPE_ID) { files.forEach(([n, t]) => download(n, t)); return; }
  for (const [n, t] of files) {
    let ok = false;
    for (let i = 0; i < 3 && !ok; i++) {
      try { const r = await jsPsychPipe.saveData(DATAPIPE_ID, n, t); ok = !!(r && !(r instanceof Error) && !r.error); }
      catch (e) { ok = false; }
    }
    if (!ok) { saveError = true; download(n, t); }   // rezerva: preuzimanje na racunar
  }
}
